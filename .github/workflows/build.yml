name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.config.name }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: latest
          target: ${{ matrix.config.target }}
          combine: true

      - name: Upload ${{ matrix.config.name }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantaMenuv1-${{ matrix.config.target }}
          path: ${{ steps.build.outputs.build-output }}

  package:
    name: Combine Multi-Platform .geode
    runs-on: ubuntu-latest
    needs: [ build ]
    if: always()
    steps:
      - name: Combine Platform Builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine
        with:
          sdk: latest

      - name: Upload Universal .geode
        uses: actions/upload-artifact@v4
        with:
          name: VantaMenuv1-universal
          path: ${{ steps.combine.outputs.build-output }}
          
